name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/volumetric_canister
          cache-on-failure: true

      - name: Cache Cargo binaries
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin
          key: cargo-bin-${{ runner.os }}-candid-extractor-ic-wasm

      - name: Setup DFX
        uses: dfinity/setup-dfx@main

      - name: Install Rust tools
        run: |
          command -v candid-extractor || cargo install candid-extractor
          command -v ic-wasm || cargo install ic-wasm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Test canister
        working-directory: apps/volumetric_canister
        run: cargo test

      - name: Build canister
        working-directory: apps/volumetric_canister
        run: make build

      - name: Build web
        run: pnpm build

      - name: Test
        run: pnpm test
