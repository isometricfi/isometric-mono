name: Deploy

on:
  push:
    branches: [main]
    paths:
      - "apps/volumetric_web/**"
      - "packages/**"
      - "pnpm-lock.yaml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy to Cloudflare
        working-directory: apps/volumetric_web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          NEXT_PUBLIC_DYNAMIC_ENVIRONMENT_ID: ${{ secrets.NEXT_PUBLIC_DYNAMIC_ENVIRONMENT_ID }}
          NEXT_PUBLIC_BASE_URL: ${{ secrets.NEXT_PUBLIC_BASE_URL }}
          NEXT_PUBLIC_MEMPOOL_URL: ${{ vars.NEXT_PUBLIC_MEMPOOL_URL }}
          NEXT_PUBLIC_TAWK_EMBED_URL: ${{ vars.NEXT_PUBLIC_TAWK_EMBED_URL }}
          NEXT_PUBLIC_APP_HOST: ${{ vars.NEXT_PUBLIC_APP_HOST }}
          NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_MARKETING_HOST: ${{ vars.NEXT_PUBLIC_MARKETING_HOST }}
        run: pnpm cf:deploy-all:prod
