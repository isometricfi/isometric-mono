[package]
name = "volumetric"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
candid = "0.10"
ic-cdk = "0.19"
ic-cdk-timers = "1.0.0"
ic-stable-structures = "0.7.2"
icrc-ledger-types = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_bytes = "0.11"
thiserror = "2.0"
ciborium = "0.2"
sha2 = "0.10"
bip322 = "0.0.10"
bitcoin = "0.32"
base64 = "0.22"
getrandom = { version = "0.2", features = ["custom"] }

[dev-dependencies]
pocket-ic = "11.0"
